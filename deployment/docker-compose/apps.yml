name: 'easyshop'
services:
    cxp-catalog-domain:
      image: kishore465/easyshop-cxp-catalog-domain
      container_name: cxp-catalog-domain
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - DB_URL=jdbc:postgresql://catalog-db:5432/postgres
        - DB_USERNAME=postgres
        - DB_PASSWORD=postgres
      ports:
        - "8091:8091"
      restart: unless-stopped
      depends_on:
        catalog-db:
          condition: service_healthy
      deploy:
        resources:
          limits:
            memory: 700m